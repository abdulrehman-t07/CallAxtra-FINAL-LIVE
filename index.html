<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CallAxtra | High-Quality Live Transfers & Lead Generation</title>
    <meta name="description" content="CallAxtra delivers compliant, conversion-ready live transfers and lead generation for healthcare, insurance, and financial service providers. Partner with us today." />
    <meta name="keywords" content="live transfers, lead generation, Medicare leads, insurance leads, healthcare marketing, TCPA compliant, call center solutions" />
    <meta name="author" content="CallAxtra" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CallAxtra | High-Quality Live Transfers & Lead Generation" />
    <meta property="og:description" content="Connecting healthcare, insurance, and financial service providers with verified, conversion-ready customers through compliant campaigns." />
    <meta property="og:site_name" content="CallAxtra" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CallAxtra | High-Quality Live Transfers & Lead Generation" />
    <meta name="twitter:description" content="Connecting healthcare, insurance, and financial service providers with verified, conversion-ready customers." />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://callaxtra.com" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Browser UI colors -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />

    <!-- Fonts (preconnect + load early to avoid layout shift) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />

    <!-- Apply saved theme before first paint (prevents a white flash in dark mode).
         Optional: ?theme=dark or ?theme=light in the URL sets and remembers the theme. -->
    <script>
      (function () {
        try {
          var param = new URLSearchParams(window.location.search).get("theme");
          if (param === "dark" || param === "light") localStorage.setItem("theme", param);
          var theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CallAxtra",
      "description": "U.S.-based marketing agency specializing in compliant live transfers and lead generation for healthcare, insurance, and financial services.",
      "url": "https://callaxtra.com",
      "telephone": "+1-760-263-0555",
      "email": "partners@callaxtra.com",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "areaServed": "US",
      "serviceType": ["Lead Generation", "Live Transfers", "Call Center Solutions"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
